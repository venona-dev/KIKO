databases:
  - name: kiko-db
    plan: free
    databaseName: kiko
    user: kiko

services:
  - type: web
    name: kiko
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kiko-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
